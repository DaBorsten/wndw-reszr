[package]
name = "windows-resizer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_Threading", "Win32_UI_Accessibility"] }

[build-dependencies]
winresource = "0.1.31"
